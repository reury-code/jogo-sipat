<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Fundo do ícone -->
  <circle cx="50" cy="50" r="48" fill="#3b82f6" stroke="#ffffff" stroke-width="2"/>
  
  <!-- Raio (eletricidade) -->
  <g fill="#ffffff" stroke="#3b82f6" stroke-width="1">
    <!-- Raio principal -->
    <path d="M 50 15 L 45 35 L 55 35 L 40 65 L 50 50 L 45 70 L 60 40 L 50 40 Z" fill="#ffffff"/>
  </g>
  
  <!-- Círculos de energia ao redor -->
  <g stroke="#ffffff" stroke-width="2" fill="none">
    <!-- Círculo 1 -->
    <circle cx="30" cy="30" r="5"/>
    <!-- Círculo 2 -->
    <circle cx="70" cy="30" r="5"/>
    <!-- Círculo 3 -->
    <circle cx="25" cy="70" r="5"/>
    <!-- Círculo 4 -->
    <circle cx="75" cy="70" r="5"/>
  </g>
  
  <!-- Linhas de energia -->
  <g stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.7">
    <line x1="30" y1="30" x2="45" y2="40"/>
    <line x1="70" y1="30" x2="55" y2="40"/>
    <line x1="25" y1="70" x2="45" y2="60"/>
    <line x1="75" y1="70" x2="55" y2="60"/>
  </g>
</svg>
