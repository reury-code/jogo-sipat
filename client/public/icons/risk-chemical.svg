<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Fundo do ícone -->
  <circle cx="50" cy="50" r="48" fill="#ef4444" stroke="#ffffff" stroke-width="2"/>
  
  <!-- Nuvem de fumaça -->
  <g fill="#ffffff" opacity="0.9">
    <!-- Nuvem superior -->
    <circle cx="35" cy="35" r="12"/>
    <circle cx="50" cy="30" r="14"/>
    <circle cx="65" cy="35" r="12"/>
    
    <!-- Nuvem inferior -->
    <circle cx="40" cy="55" r="13"/>
    <circle cx="55" cy="50" r="15"/>
    <circle cx="70" cy="55" r="13"/>
  </g>
  
  <!-- Linhas de dispersão -->
  <g stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M 25 45 L 20 40"/>
    <path d="M 75 45 L 80 40"/>
    <path d="M 25 60 L 15 65"/>
    <path d="M 75 60 L 85 65"/>
  </g>
</svg>
