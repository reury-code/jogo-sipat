<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Fundo do ícone -->
  <circle cx="50" cy="50" r="48" fill="#eab308" stroke="#ffffff" stroke-width="2"/>
  
  <!-- Cabeça -->
  <circle cx="50" cy="25" r="8" fill="#ffffff" stroke="#eab308" stroke-width="1.5"/>
  
  <!-- Corpo curvado (postura inadequada) -->
  <path d="M 50 33 Q 45 40 42 50 Q 40 58 45 65" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Braço esquerdo -->
  <line x1="42" y1="40" x2="25" y2="35" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Braço direito -->
  <line x1="50" y1="38" x2="68" y2="32" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Perna esquerda -->
  <line x1="45" y1="65" x2="40" y2="80" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Perna direita -->
  <line x1="45" y1="65" x2="50" y2="80" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Símbolo de alerta (triângulo) -->
  <g transform="translate(65, 70)">
    <path d="M 0 -8 L 8 8 L -8 8 Z" fill="#ffffff" stroke="#eab308" stroke-width="1"/>
    <line x1="0" y1="-3" x2="0" y2="3" stroke="#eab308" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="0" cy="6" r="1" fill="#eab308"/>
  </g>
</svg>
